# Inventory 前端生产配置: SPA 静态托管 + /api 反代到 FastAPI 容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 附件上传上限跟后端对齐 (FastAPI 限 10MB, 这里放宽到 12MB 让后端返回可读错误)
    client_max_body_size 12m;

    # API 反代: 容器网络内直连 api 服务
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # 16 步校验是子进程, 可能跑几十秒
    }

    # SPA 兜底: 前端路由全部回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存 (Vite 产物带 hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
